<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Komari Agent 配置</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --muted: #7a8291;
    --primary: #2563eb;
    --danger: #dc2626;
    --ok: #16a34a;
    --code-bg: #f8f9fb;
    --key: #7c3aed;
    --str: #15803d;
    --num: #b45309;
    --bool: #2563eb;
    --null: #9333ea;
    --punc: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    max-width: 1000px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd2dc; display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
  .dot.off { background: var(--danger); }
  .spacer { flex: 1; }
  button {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 7px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #f0f2f6; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { color: var(--danger); border-color: #f3c4c4; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .editor-wrap { position: relative; }
  .editor-wrap pre, .editor-wrap textarea {
    width: 100%; min-height: 380px; margin: 0; padding: 14px;
    font: 13px/1.6 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    white-space: pre; overflow: auto; tab-size: 2;
    border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box;
  }
  .editor-wrap pre {
    position: absolute; inset: 0; margin: 0;
    color: var(--punc); background: var(--code-bg);
    pointer-events: none;
  }
  .editor-wrap textarea {
    position: relative; display: block;
    background: transparent; color: #1f2430; caret-color: var(--primary);
    resize: vertical; outline: none;
  }
  .editor-wrap textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .editor-wrap textarea.dim { color: transparent; }
  .editor-wrap textarea.dim::selection { background: rgba(37,99,235,.25); color: transparent; }
  .editor-wrap pre .key   { color: var(--key); }
  .editor-wrap pre .str   { color: var(--str); }
  .editor-wrap pre .num   { color: var(--num); }
  .editor-wrap pre .bool  { color: var(--bool); }
  .editor-wrap pre .null  { color: var(--null); }
  .editor-wrap pre .punc  { color: var(--punc); }

  .msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; white-space: pre-wrap; word-break: break-all; }
  .msg.show { display: block; }
  .msg.err { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  .msg.ok  { background: #f0fdf4; color: var(--ok);    border: 1px solid #bbf7d0; }
  .msg.info{ background: #eff6ff; color: #1d4ed8;      border: 1px solid #bfdbfe; }

  details { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; }
  details summary { padding: 10px 14px; cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
  #logbox {
    margin: 0; padding: 12px 14px; max-height: 240px; overflow: auto;
    background: #0f1420; color: #c8d3e8;
    font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    border-top: 1px solid var(--border);
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  kbd { background: #eef0f4; border: 1px solid #d5d9e0; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <h1>
    <span>Komari Agent</span>
    <span class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">读取状态…</span></span>
  </h1>
  <div class="sub">直接编辑 config.json 原始内容，保存时校验 JSON 语法，失败将提示具体位置且不会写入。</div>

  <div class="toolbar">
    <button class="primary" id="saveBtn">保存配置</button>
    <button id="reloadBtn">重新加载</button>
    <button id="restartBtn" class="danger">重启 Agent</button>
    <span class="spacer"></span>
    <span class="hint">快捷键：<kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</span>
  </div>

  <div class="hint" style="margin-top:-4px;margin-bottom:10px">
    日志控制（应用扩展字段，Agent 自身会忽略）：<kbd>_fnos_log_enabled</kbd> 设 <kbd>false</kbd> 关闭日志；
    <kbd>_fnos_log_max_size_mb</kbd> 轮转上限（MB）；<kbd>_fnos_log_keep</kbd> 保留份数。保存后点"重启 Agent"生效。
  </div>

  <div class="editor-wrap">
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="editor" spellcheck="false" placeholder="加载 config.json 中…"></textarea>
  </div>

  <div class="msg" id="msg"></div>

  <details id="logWrap">
    <summary>Agent 运行日志（启动失败时查看）</summary>
    <pre id="logbox"></pre>
  </details>
</div>

<script>
(function () {
  "use strict";

  // CGI 基础路径：location.pathname = .../index.cgi/ 或 .../index.cgi
  var path = location.pathname;
  var API = path.replace(/\/+$/, "").replace(/index\.cgi$/, "index.cgi");
  // 确保指向 index.cgi（不带尾部斜杠），子接口为 index.cgi/api/...
  if (/\/index\.cgi\/?$/.test(API) === false) {
    API = API.replace(/(\/index\.cgi)\/.*$/, "$1");
  }

  var $ = function (id) { return document.getElementById(id); };
  var editor = $("editor"), hl = $("hl"), msg = $("msg"), dot = $("dot"), statusText = $("statusText");

  var dirty = false;

  // ---------- 消息 ----------
  var msgTimer = null;
  function showMsg(kind, text, persist) {
    msg.className = "msg show " + kind;
    msg.textContent = text;
    if (msgTimer) clearTimeout(msgTimer);
    if (!persist) msgTimer = setTimeout(function () { msg.className = "msg"; }, 6000);
  }
  function clearMsg() { msg.className = "msg"; }

  // ---------- JSON 错误定位（V8 消息解析 + 自研状态机兜底，纯 JS 零依赖） ----------
  function parseErrPos(text, err) {
    var msg = (err && err.message) || "";
    var m = /\(line (\d+) column (\d+)\)/.exec(msg);
    if (m) return { line: +m[1], col: +m[2], message: msg };
    var p = /position (\d+)/.exec(msg);
    if (p) {
      var pos = +p[1];
      var before = text.slice(0, pos);
      return { line: before.split("\n").length, col: pos - before.lastIndexOf("\n"), message: msg };
    }
    return null;
  }

  function jsonLocateError(text) {
    var i = 0, n = text.length, line = 1, col = 1;
    function pos() { return { line: line, col: col }; }
    function adv1() { if (i < n) { if (text[i] === "\n") { line++; col = 1; } else { col++; } i++; } }
    function advN(k) { while (k-- > 0 && i < n) adv1(); }
    function fail(reason, p) { return { line: p.line, col: p.col, reason: reason }; }
    var stack = [];
    function top() { return stack[stack.length - 1]; }
    var rootState = "start";

    while (i < n) {
      var c = text[i];
      if (c === " " || c === "\t" || c === "\n" || c === "\r") { adv1(); continue; }
      var ctx = top();
      var atStart = !ctx || ctx.phase === "start";
      var objKey = !!(ctx && ctx.type === "obj" && ctx.phase === "key");
      var objColon = !!(ctx && ctx.type === "obj" && ctx.phase === "colon");
      var afterVal = !!(ctx && ctx.phase === "after");

      if (atStart || objColon) {
        if (c === '"') {
          var sp = pos(); adv1(); var closed = false;
          while (i < n) {
            var d = text[i];
            if (d === "\\") { adv1(); adv1(); continue; }
            if (d === '"') { adv1(); closed = true; break; }
            if (d === "\n") return fail("字符串含未转义换行", sp);
            adv1();
          }
          if (!closed) return fail("字符串未闭合（缺少结尾引号）", sp);
          if (ctx) {
            if (ctx.type === "obj" && ctx.phase === "start") ctx.phase = "key";
            else ctx.phase = "after";
            ctx.justComma = false;
          } else rootState = "after";
          continue;
        }
        if (c === "{" || c === "[") {
          stack.push({ type: c === "{" ? "obj" : "arr", phase: "start", justComma: false });
          adv1(); continue;
        }
        if (c === "}" || c === "]") {
          var pc = pos();
          if (!ctx) return fail("多余的 '" + c + "'", pc);
          if (ctx.phase !== "start") return fail("此处不应出现 '" + c + "'（值未完成）", pc);
          if (ctx.justComma) return fail("尾随逗号不允许", pc);
          stack.pop();
          if (top()) { top().phase = "after"; top().justComma = false; } else rootState = "after";
          adv1(); continue;
        }
        if (c === "," || c === ":") return fail("此处不应出现 '" + c + "'（应为值）", pos());
        var pt = pos();
        var m = /^[^\s,:\]}"']+/.exec(text.slice(i));
        var tok = m ? m[0] : c;
        advN(tok.length);
        var valid = tok === "true" || tok === "false" || tok === "null" ||
                    /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(tok);
        if (!valid) return fail("非法值 '" + tok + "'", pt);
        if (ctx) { ctx.phase = "after"; ctx.justComma = false; }
        else {
          if (rootState === "after") return fail("值之间缺少 ',' 或结构分隔符", pt);
          rootState = "after";
        }
        continue;
      }
      if (objKey) {
        if (c !== ":") return fail("key 后应为 ':'，实际是 '" + c + "'", pos());
        ctx.phase = "colon"; adv1(); continue;
      }
      if (afterVal) {
        if (c === ",") { ctx.phase = "start"; ctx.justComma = true; adv1(); continue; }
        if (c === "}") {
          if (ctx.type !== "obj") return fail("期望 ']' 实际 '}'", pos());
          stack.pop(); if (top()) { top().phase = "after"; top().justComma = false; } else rootState = "after";
          adv1(); continue;
        }
        if (c === "]") {
          if (ctx.type !== "arr") return fail("期望 '}' 实际 ']'", pos());
          stack.pop(); if (top()) { top().phase = "after"; top().justComma = false; } else rootState = "after";
          adv1(); continue;
        }
        return fail("此处不应出现 '" + c + "'（应为 ',' 或闭合符）", pos());
      }
      return fail("未知状态", pos());
    }
    if (stack.length) {
      var t = top();
      if (t.type === "obj" && t.phase === "key") return fail("key 后缺少 ':'", pos());
      if (t.type === "obj" && t.phase === "colon") return fail("key 后缺少值", pos());
      return fail("结构未闭合：缺少 " + stack.map(function (s) { return s.type === "obj" ? "}" : "]"; }).reverse().join(""), pos());
    }
    return null;
  }

  // ---------- 前端 JSON 语法预校验（禁止保存 + 具体行列） ----------
  function validateText(text) {
    try { JSON.parse(text); return null; } catch (e) {
      var p = parseErrPos(text, e);
      if (p) return "第 " + p.line + " 行第 " + p.col + " 列：" + p.message;
      var loc = jsonLocateError(text);
      if (loc) return "第 " + loc.line + " 行第 " + loc.col + " 列：" + loc.reason;
      return "JSON 语法错误：" + (e.message || "");
    }
  }

  // ---------- 语法高亮（失败自动降级，不影响编辑） ----------
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function highlight(text) {
    return esc(text).replace(
      /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
      function (m) {
        var cls = "num";
        if (m.charAt(0) === '"') cls = /:\s*$/.test(m) ? "key" : "str";
        else if (/^(true|false)$/.test(m)) cls = "bool";
        else if (m === "null") cls = "null";
        return '<span class="' + cls + '">' + m + "</span>";
      }
    );
  }
  var hlOk = true;
  function render() {
    if (!hlOk) return;
    try {
      hl.innerHTML = highlight(editor.value) + "\n";
      // 同步滚动
      hl.scrollTop = editor.scrollTop;
      hl.scrollLeft = editor.scrollLeft;
      editor.classList.add("dim");
    } catch (e) {
      hlOk = false;
      editor.classList.remove("dim");
      hl.innerHTML = "";
    }
  }
  editor.addEventListener("scroll", function () { hl.scrollTop = editor.scrollTop; hl.scrollLeft = editor.scrollLeft; });
  editor.addEventListener("input", function () { dirty = true; render(); });

  // ---------- API ----------
  function apiGet(url) {
    return fetch(url, { cache: "no-store" });
  }
  function apiPost(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    });
  }

  // ---------- 加载配置 ----------
  function loadConfig() {
    return apiGet(API + "/api/config").then(function (res) {
      if (res.status === 404) throw new Error("config.json 不存在，请检查安装向导是否已正确填写并重启应用");
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function (text) {
      editor.value = text;
      dirty = false;
      render();
      clearMsg();
    });
  }

  // ---------- 保存 ----------
  function saveConfig() {
    var text = editor.value;
    if (!text.trim()) { showMsg("err", "配置内容为空，禁止保存。", true); return; }

    // 前端预校验：失败给出精确行列并禁止提交
    var fe = validateText(text);
    if (fe) { showMsg("err", "JSON 语法校验失败（未保存）：\n" + fe, true); return; }

    $("saveBtn").disabled = true;
    apiPost(API + "/api/config", text).then(function (res) {
      return res.json().then(function (data) { return { res: res, data: data }; });
    }).then(function (r) {
      if (r.res.ok && r.data.ok) {
        dirty = false;
        showMsg("ok", r.data.message || "配置已保存。", true);
      } else {
        // 后端（agent 自身）校验失败：展示 agent 给出的错误日志
        var e = (r.data && r.data.error) || ("HTTP " + r.res.status);
        showMsg("err", "保存被拒绝（配置未写入）：\n" + e, true);
      }
    }).catch(function (e) {
      showMsg("err", "保存请求失败：" + e.message, true);
    }).finally(function () {
      $("saveBtn").disabled = false;
    });
  }

  // ---------- 重启 Agent ----------
  function restartAgent() {
    if (!confirm("确定重启 Komari Agent 吗？\n重启将重新加载 config.json，短暂断开与面板的连接。")) return;
    $("restartBtn").disabled = true;
    apiPost(API + "/api/restart", "").then(function (res) { return res.json(); })
      .then(function (d) {
        if (d.ok) showMsg("info", "Agent 正在重启…", false);
        else showMsg("err", "重启失败：" + (d.error || "未知错误"), true);
      })
      .catch(function (e) { showMsg("err", "重启请求失败：" + e.message, true); })
      .finally(function () { $("restartBtn").disabled = false; });
  }

  // ---------- 状态轮询 ----------
  function pollStatus() {
    apiGet(API + "/api/status").then(function (res) { return res.json(); }).then(function (d) {
      if (d.running) {
        dot.className = "dot on";
        statusText.textContent = "Agent 运行中 (PID " + d.pid + ")";
      } else {
        dot.className = "dot off";
        statusText.textContent = "Agent 未运行";
      }
    }).catch(function () {
      dot.className = "dot off";
      statusText.textContent = "状态不可用";
    });
  }

  // ---------- 日志 ----------
  function loadLog() {
    apiGet(API + "/api/log").then(function (res) { return res.text(); }).then(function (t) {
      $("logbox").textContent = t || "(日志为空)";
    }).catch(function () {
      $("logbox").textContent = "日志读取失败";
    });
  }
  $("logWrap").addEventListener("toggle", function () { if (this.open) loadLog(); });

  // ---------- 事件 ----------
  $("saveBtn").addEventListener("click", saveConfig);
  $("reloadBtn").addEventListener("click", function () {
    loadConfig().catch(function (e) { showMsg("err", "加载失败：" + e.message, true); });
  });
  $("restartBtn").addEventListener("click", restartAgent);
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      saveConfig();
    }
  });

  // Tab 键插入两个空格（不跳转焦点）
  editor.addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var s = editor.selectionStart, t = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(t);
      editor.selectionStart = editor.selectionEnd = s + 2;
      dirty = true;
      render();
    }
  });

  // ---------- 初始化 ----------
  loadConfig().catch(function (e) {
    showMsg("err", "加载失败：" + e.message, true);
    editor.placeholder = "config.json 加载失败";
  });
  pollStatus();
  setInterval(pollStatus, 3000);
})();
</script>
</body>
</html>
